<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFood — Sabor & Saber (Bootstrap)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="bg-warning bg-gradient text-white text-center py-4  mb-4">
    <h1>Sabor &amp; Saber</h1>
    <p>Cardápio digital</p>
  </header>

  <!--
    LIVE CODE — PASSO 3 (Container e Grid)
    Envolva o conteúdo em:
      <main class="container">
        <div class="row g-3">
          ...os articles receberão col-12 col-md-6 col-lg-4...
        </div>
      </main>
  -->
  <main class="container">
    <h2 class="text-center mb-4">Nosso Cardápio</h2>

    <!--
      O JS vai inserir os cards aqui.
      Quando aplicar o grid, a section vira a row
      e cada article (criado pelo JS) recebe as classes col.
    -->
    <section class="row g-3" id="cardapio">
    </section>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-4">
    <small>TechFood · Aula 1 Bootstrap · Prof. Marlon</small>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
